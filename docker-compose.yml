# 语义缓存网关与技术雷达的编排文件。
#
# 生产安全约定：
#   两个服务的端口都只绑到宿主机回环（127.0.0.1），不直接对外。
#   网关持有上游大模型的 API Key，若绑 0.0.0.0 又放通安全组，
#   任何人都能拿它当免费模型接口刷 Token。
#   对外访问一律经 nginx 反代，并携带 GATEWAY_AUTH_TOKEN。
#
# 内存约定：
#   ECS 只有 3.4G 内存，网关（ONNX 推理）限 1200m、雷达限 256m，
#   避免与机器上已有的容器互相挤兑。

services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # 可在 .env 里设置 PIP_INDEX_URL 换源；国内主机建议用清华源。
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    command: uvicorn gateway.app.main:app --host 0.0.0.0 --port 8000
    env_file:
      - .env
    environment:
      VECTOR_STORE_PATH: /app/data/chroma
      EMBEDDING_MODEL_PATH: /app/models/multilingual-e5-small
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/app/data
      - ./models:/app/models:ro
    mem_limit: 1200m
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4).status == 200 else 1)"
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3
    restart: unless-stopped

  radar:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    command: uvicorn radar.app.main:app --host 0.0.0.0 --port 8001
    env_file:
      - .env
    environment:
      GATEWAY_BASE_URL: http://gateway:8000
      RADAR_DATABASE_PATH: /app/data/radar.db
    ports:
      - "127.0.0.1:8001:8001"
    volumes:
      - ./data:/app/data
    mem_limit: 256m
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=4).status == 200 else 1)"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    depends_on:
      - gateway
    restart: unless-stopped
