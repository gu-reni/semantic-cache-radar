<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>技术雷达</title>
<meta name="description" content="聚合技术社区资讯，自动生成中文摘要。">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="grain" aria-hidden="true"></div>

<header class="masthead">
  <h1>技术雷达</h1>
  <p class="standfirst">聚合 Hacker News、GitHub、V2EX 的技术资讯，自动生成中文摘要。</p>
</header>

<main>
  <nav class="filters" aria-label="按来源筛选">
    <button type="button" class="filter is-active" data-source="">全部</button>
    <button type="button" class="filter" data-source="hackernews">Hacker News</button>
    <button type="button" class="filter" data-source="github-trending">GitHub</button>
    <button type="button" class="filter" data-source="v2ex">V2EX</button>
  </nav>

  <nav class="filters level-filters" aria-label="按证据等级筛选">
    <button type="button" class="filter level is-active" data-level="">全部等级</button>
    <button type="button" class="filter level" data-level="证据充分">证据充分</button>
    <button type="button" class="filter level" data-level="信号在积累">信号在积累</button>
    <button type="button" class="filter level" data-level="刚出现">刚出现</button>
    <button type="button" class="filter level" data-level="有红旗">有红旗</button>
  </nav>

  <p class="status" id="status" role="status" aria-live="polite">正在载入…</p>

  <ol class="entries" id="entries"></ol>
</main>

<footer>
  <p id="updated"></p>
</footer>

<script src="/static/app.js"></script>
</body>
</html>
